<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huber Technologies</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6f9;font-family:Arial,sans-serif}
.main-card{max-width:850px;margin:70px auto;background:white;border-radius:20px;padding:40px;box-shadow:0 10px 30px rgba(0,0,0,.10)}
.brand{font-weight:700;color:#222}
.password-wrapper{position:relative}.password-wrapper input{padding-right:50px}
.eye-button{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer}
</style>
</head>
<body>
<div class="container">
{% if messages %}{% for message in messages %}<div class="alert alert-danger mt-3">{{ message }}</div>{% endfor %}{% endif %}
{% block content %}{% endblock %}
</div>
<script>
function togglePassword(button){
 const input=document.getElementById(button.dataset.target);
 if(input.type==="password"){input.type="text";button.textContent="◉";}
 else{input.type="password";button.textContent="◌";}
}
</script>
</body>
</html>
